# Nginx-VHost für Pocket ID auf Centminmod (AlmaLinux 9.8)
# Ziel-Pfad auf der VPS: /usr/local/nginx/conf/conf.d/auth.mojobus.co.ssl.conf
#
# *** KRITISCH (GitHub pocket-id#1606/#1715): ***
# drop.conf und autoprotect MÜSSEN auskommentiert bleiben!
# Sie blocken SvelteKit-Routen (__data.json, /_app/...) und verursachen
# sonst "Internal Error" in der Pocket-ID-Admin-UI.
#
# Optional (für ACME-Validierung): Port-80-VHost mit
#   location ^~ /.well-known/acme-challenge/ { root /home/nginx/domains/auth.mojobus.co/public; }
# Der HTTPS-Block unten verweist auf:
#   /usr/local/nginx/conf/ssl/auth.mojobus.co/auth.mojobus.co.crt.key.conf
# (Centminmod-Include-Datei, Inhalt:
#   ssl_certificate     /usr/local/nginx/conf/ssl/auth.mojobus.co/auth.mojobus.co.crt;
#   ssl_certificate_key /usr/local/nginx/conf/ssl/auth.mojobus.co/auth.mojobus.co.key;)

server {
  listen 443 ssl http2;
  server_name auth.mojobus.co www.auth.mojobus.co;

  include /usr/local/nginx/conf/ssl/auth.mojobus.co/auth.mojobus.co.crt.key.conf;
  include /usr/local/nginx/conf/ssl_include.conf;

  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers   on;

  # HSTS erst aktivieren, wenn alles stabil laeuft
  #add_header Strict-Transport-Security "max-age=31536000; includeSubdomains;";
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  ssl_buffer_size 1369;
  ssl_session_tickets on;

  access_log /home/nginx/domains/auth.mojobus.co/log/access.log combined buffer=256k flush=5m;
  error_log /home/nginx/domains/auth.mojobus.co/log/error.log;

  # KRITISCH: auskommentiert (blockt SvelteKit-Routen)
  # include /usr/local/nginx/conf/autoprotect/auth.mojobus.co/autoprotect-auth.mojobus.co.conf;

  root /home/nginx/domains/auth.mojobus.co/public;
  #include /usr/local/nginx/conf/cloudflare.conf;   # Cloudflare-Proxy ist OFF
  include /usr/local/nginx/conf/503include-main.conf;

  location / {
    include /usr/local/nginx/conf/503include-only.conf;

    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # Pocket ID braucht kein PHP:
  # include /usr/local/nginx/conf/php.conf;

  # staticfiles aus: alle Requests gehen an Pocket ID
  # include /usr/local/nginx/conf/pre-staticfiles-local-auth.mojobus.co.conf;
  # include /usr/local/nginx/conf/pre-staticfiles-global.conf;
  # include /usr/local/nginx/conf/staticfiles.conf;

  # KRITISCH: auskommentiert (blockt SvelteKit-Routen)
  # include /usr/local/nginx/conf/drop.conf;

  #include /usr/local/nginx/conf/errorpage.conf;
  include /usr/local/nginx/conf/vts_server.conf;
}
